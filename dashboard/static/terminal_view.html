<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows PowerShell</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/cascadia-code');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c0c0c;
            color: #cccccc;
            font-family: 'Cascadia Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 14.5px;
            line-height: 1.35;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Windows 11 Windows Terminal Titlebar */
        .titlebar {
            background-color: #1f1f1f;
            height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            border-bottom: 1px solid #2b2b2b;
            padding-left: 8px;
        }

        .tabs-container {
            display: flex;
            align-items: flex-end;
            height: 100%;
        }

        .tab {
            background-color: #0c0c0c;
            color: #ffffff;
            height: 32px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid #2b2b2b;
            border-bottom: none;
            width: 220px;
        }

        .tab-icon {
            color: #0176d3;
            font-weight: bold;
            font-size: 13px;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-close {
            color: #888;
            font-size: 14px;
        }

        .tab-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
            margin-bottom: 6px;
            color: #cccccc;
            font-size: 12px;
        }

        .action-btn {
            padding: 4px 6px;
            border-radius: 4px;
        }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .win-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            font-size: 11px;
            font-family: 'Segoe Fluent Icons', 'Segoe UI', sans-serif;
        }

        /* Terminal Body */
        .terminal-content {
            background-color: #0c0c0c;
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            color: #cccccc;
            white-space: pre-wrap;
        }

        .green { color: #16c60c; }
        .cyan { color: #3b78ff; }
        .yellow { color: #f9f1a5; }
        .white { color: #ffffff; }

        .cursor {
            display: inline-block;
            width: 8.5px;
            height: 17px;
            background-color: #ffffff;
            vertical-align: sub;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Real Windows Terminal Titlebar -->
    <div class="titlebar">
        <div class="tabs-container">
            <div class="tab">
                <span class="tab-icon">&gt;_</span>
                <span class="tab-title">Windows PowerShell</span>
                <span class="tab-close">&#10005;</span>
            </div>
            <div class="tab-actions">
                <span class="action-btn">&#43;</span>
                <span class="action-btn">&#9662;</span>
            </div>
        </div>
        <div class="window-controls">
            <div class="win-btn">&#8212;</div>
            <div class="win-btn">&#9633;</div>
            <div class="win-btn" style="color:#ffffff;">&#10005;</div>
        </div>
    </div>

    <!-- Real PowerShell Content -->
    <div class="terminal-content" id="term">Windows PowerShell
Copyright (C) Microsoft Corporation. All rights reserved.

<span class="white">PS A:\Projects\L&T&gt;</span> <span class="white" id="cmd1"></span><span id="output1"></span>
<span id="prompt2" style="display:none;"><span class="white">PS A:\Projects\L&T&gt;</span> <span class="white" id="cmd2"></span><span id="output2"></span></span>
<span id="prompt3" style="display:none;"><span class="white">PS A:\Projects\L&T&gt;</span> <span class="white" id="cmd3"></span><span id="output3"></span></span>
    </div>

    <script>
        const cmd1Text = "pytest tests/ -v";
        const output1Text = `
============================= test session starts =============================
platform win32 -- Python 3.11.9, pytest-8.1.1, pluggy-1.6.0
rootdir: A:\\Projects\\L&T
collected 16 items

tests\\test_decisions.py ....                                             <span class="green">[ 25%]</span>
tests\\test_host_board_parity.py ...                                      <span class="green">[ 43%]</span>
tests\\test_morphology.py ...                                             <span class="green">[ 62%]</span>
tests\\test_quality.py ....                                               <span class="green">[ 87%]</span>
tests\\test_windowing.py ..                                               <span class="green">[100%]</span>

<span class="green">============================== 16 passed in 8.74s ==============================</span>
`;

        const cmd2Text = "python scripts/compare_host_vs_board.py";
        const output2Text = `
================================================================================
CardioSentinel Edge - Host-vs-Firmware Parity Audit
================================================================================
[BUILD] Verified embedded C firmware test harness: tests\\firmware_runner.exe
Model: 3-Layer FP32 Conv1D (8,627 parameters in 33.7 KB internal SRAM)

Demo Scenario          | Python Decision  | C Firmware Decision | Parity
--------------------------------------------------------------------------------
01_clean_normal        | ACCEPT (Normal)  | ACCEPT (Normal)     | <span class="green">MATCH [OK]</span>
02_clean_af            | ACCEPT (AF)      | ACCEPT (AF)         | <span class="green">MATCH [OK]</span>
03_clean_other_pvc     | ACCEPT (Other)   | ACCEPT (Other)      | <span class="green">MATCH [OK]</span>
04_baseline_wander     | ABSTAIN (Unus.)  | ABSTAIN (Unus.)     | <span class="green">MATCH [OK]</span>
05_muscle_noise_emg    | REVIEW (Flagged) | REVIEW (Flagged)    | <span class="green">MATCH [OK]</span>
06_lead_off_flatline   | ABSTAIN (Unus.)  | ABSTAIN (Unus.)     | <span class="green">MATCH [OK]</span>
07_rail_saturation     | ABSTAIN (Unus.)  | ABSTAIN (Unus.)     | <span class="green">MATCH [OK]</span>
08_mig_distortion      | REVIEW (Flagged) | REVIEW (Flagged)    | <span class="green">MATCH [OK]</span>
--------------------------------------------------------------------------------
<span class="green">[AUDIT PASSED] 100% Host-vs-Board Decision Parity Confirmed across all test vectors.</span>
`;

        const cmd3Text = "python dashboard/server.py";
        const output3TextA = `
INFO:     Started server process [18320]
INFO:     Waiting for application startup.
INFO:     Application startup complete.
INFO:     Uvicorn running on <span class="cyan">http://127.0.0.1:8000</span> (Press CTRL+C to quit)
===========================================================================
CardioSentinel Edge - Real-Time Telemetry SaaS Server
Launching on: http://localhost:8000
===========================================================================
`;

        const output3TextB = `INFO:     127.0.0.1:60017 - "GET / HTTP/1.1" 200 OK
[EXPORT] Successfully generated C header: firmware/esp32s3/models/tinycnn_weights.h
[EXPORT] Total Fused Parameters: 8627 (~33.70 KB)
INFO:     127.0.0.1:60017 - "GET /api/scenario/01_clean_normal HTTP/1.1" 200 OK
INFO:     127.0.0.1:60017 - "GET /ws/telemetry HTTP/1.1" 101 Switching Protocols
<span class="green">[LIVE STREAM] Active telemetry socket established. Streaming 250 SPS...</span> <span class="cursor"></span>
`;

        async function typeCommand(elemId, text, speed = 40) {
            const el = document.getElementById(elemId);
            for (let i = 0; i < text.length; i++) {
                el.textContent += text[i];
                await new Promise(r => setTimeout(r, speed));
            }
        }

        async function runSequence() {
            const term = document.getElementById("term");

            // 0.0s - 1.2s: Initial pause
            await new Promise(r => setTimeout(r, 1200));

            // 1.2s - 2.0s: Type pytest
            await typeCommand("cmd1", cmd1Text, 45);
            await new Promise(r => setTimeout(r, 350));

            // 2.35s - 4.2s: Stream pytest output (finishes right around 4.2s when subtitle 2 starts)
            document.getElementById("output1").innerHTML = output1Text;
            term.scrollTop = term.scrollHeight;

            // 4.2s - 6.2s: Let user read passing tests
            await new Promise(r => setTimeout(r, 2000));

            // 6.2s: Show prompt 2
            document.getElementById("prompt2").style.display = "block";
            await new Promise(r => setTimeout(r, 300));

            // 6.5s - 8.2s: Type compare_host_vs_board
            await typeCommand("cmd2", cmd2Text, 42);
            await new Promise(r => setTimeout(r, 300));

            // 8.5s: Output parity table (matches subtitle 3 "GCC firmware confirms 100% bit-accurate decision parity")
            document.getElementById("output2").innerHTML = output2Text;
            term.scrollTop = term.scrollHeight;

            // 8.5s - 11.8s: Let user read the 100% parity table
            await new Promise(r => setTimeout(r, 3300));

            // 11.8s: Show prompt 3
            document.getElementById("prompt3").style.display = "block";
            await new Promise(r => setTimeout(r, 200));

            // 12.0s - 13.0s: Type python dashboard/server.py
            await typeCommand("cmd3", cmd3Text, 38);
            await new Promise(r => setTimeout(r, 200));

            // 13.2s: Print authentic uvicorn server startup (matches subtitle 4 "Launching clinical telemetry gateway on port 8000...")
            document.getElementById("output3").innerHTML = output3TextA;
            term.scrollTop = term.scrollHeight;

            // 15.0s: Browser connects, live HTTP/WS telemetry starts streaming
            await new Promise(r => setTimeout(r, 1800));
            document.getElementById("output3").innerHTML = output3TextA + output3TextB;
            term.scrollTop = term.scrollHeight;

            // Notice: WE NEVER PRINT A FAKE PROMPT 4! The server is actively running in the foreground with a blinking cursor!
        }

        window.onload = runSequence;
    </script>
</body>
</html>
