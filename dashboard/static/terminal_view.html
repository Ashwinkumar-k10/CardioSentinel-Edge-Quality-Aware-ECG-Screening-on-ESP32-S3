<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows PowerShell</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/cascadia-code');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #cccccc;
            font-family: 'Cascadia Mono', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 14.5px;
            line-height: 1.35;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Windows 11 Windows Terminal Titlebar */
        .titlebar {
            background-color: #1f1f1f;
            height: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            border-bottom: 1px solid #2b2b2b;
            padding-left: 8px;
        }

        .tabs-container {
            display: flex;
            align-items: flex-end;
            height: 100%;
        }

        .tab {
            background-color: #0c0c0c;
            color: #ffffff;
            height: 32px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid #2b2b2b;
            border-bottom: none;
            width: 220px;
            position: relative;
        }

        .tab-icon {
            color: #0176d3;
            font-weight: bold;
            font-size: 13px;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tab-close {
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .tab-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 6px;
            margin-bottom: 6px;
            color: #cccccc;
            font-size: 12px;
        }

        .action-btn {
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
        }
        .action-btn:hover { background-color: #333333; }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .win-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cccccc;
            font-size: 11px;
            font-family: 'Segoe Fluent Icons', 'Segoe UI', sans-serif;
            cursor: pointer;
        }
        .win-btn:hover { background-color: #333333; }
        .win-btn.close:hover { background-color: #e81123; color: white; }

        /* Terminal Body */
        .terminal-content {
            background-color: #0c0c0c;
            flex: 1;
            padding: 12px 14px;
            overflow-y: auto;
            color: #cccccc;
            white-space: pre-wrap;
        }

        .green { color: #16c60c; }
        .cyan { color: #3b78ff; }
        .yellow { color: #f9f1a5; }
        .red { color: #e74856; }
        .white { color: #ffffff; }
        .gray { color: #767676; }

        .cursor {
            display: inline-block;
            width: 8.5px;
            height: 17px;
            background-color: #ffffff;
            vertical-align: sub;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Real Windows Terminal Titlebar -->
    <div class="titlebar">
        <div class="tabs-container">
            <div class="tab">
                <span class="tab-icon">&gt;_</span>
                <span class="tab-title">Windows PowerShell</span>
                <span class="tab-close">&#10005;</span>
            </div>
            <div class="tab-actions">
                <span class="action-btn">&#43;</span>
                <span class="action-btn">&#9662;</span>
            </div>
        </div>
        <div class="window-controls">
            <div class="win-btn">&#8212;</div>
            <div class="win-btn">&#9633;</div>
            <div class="win-btn close">&#10005;</div>
        </div>
    </div>

    <!-- Real PowerShell Content -->
    <div class="terminal-content" id="term">

<span id="prompt2" style="display:none;"><span class="white">PS A:\Projects\L&T&gt;</span> <span class="white" id="cmd2"></span><span id="output2"></span></span>
<span id="prompt3" style="display:none;"><span class="white">PS A:\Projects\L&T&gt;</span> <span class="cursor"></span></span>
    </div>

    <script>
        const cmd1Text = "pytest tests/ -v";
        const output1Text = `

        const cmd2Text = "python scripts/compare_host_vs_board.py";
        const output2Text = `

        async function typeCommand(elemId, text, speed = 40) {
            const el = document.getElementById(elemId);
            for (let i = 0; i < text.length; i++) {
                el.textContent += text[i];
                await new Promise(r => setTimeout(r, speed));
            }
        }

        async function runSequence() {
            await new Promise(r => setTimeout(r, 600));
            // Type cmd 1
            await typeCommand("cmd1", cmd1Text, 45);
            await new Promise(r => setTimeout(r, 400));
            document.getElementById("output1").innerHTML = output1Text;

            // Prompt 2
            await new Promise(r => setTimeout(r, 1200));
            document.getElementById("prompt2").style.display = "block";
            await typeCommand("cmd2", cmd2Text, 40);
            await new Promise(r => setTimeout(r, 400));
            document.getElementById("output2").innerHTML = output2Text;

            // Prompt 3
            await new Promise(r => setTimeout(r, 800));
            document.getElementById("prompt3").style.display = "block";
        }

        window.onload = runSequence;
    </script>
</body>
</html>
